# مثال Nginx — subdomain منفصل (لا يلمس مواقعك الأخرى)
# ضع الملف في: /etc/nginx/sites-available/whatsapp-bridge
# ثم: ln -s ... sites-enabled && nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name wa-api.example.com;   # ← غيّر لساب‌دومينك

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# SSL (بعد certbot):
# certbot --nginx -d wa-api.example.com
